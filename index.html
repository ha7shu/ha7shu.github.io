<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harsh Sharma</title>
<meta name="description" content="Harsh Sharma's personal website.">
<meta property="og:title" content="Harsh Sharma">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%234a5cff'/%3E%3Ctext x='32' y='45' font-size='36' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eceffa; --ink: #12162b; --muted: #5b6180; --accent: #4a5cff;
    --glass: rgba(255,255,255,.5); --glass-line: rgba(255,255,255,.8);
    --tile: rgba(255,255,255,.75); --shadow: 0 12px 40px rgba(60,70,150,.14);
    --spot: rgba(255,255,255,.55);
    --o1: #8da2ff; --o2: #d3a9ff; --o3: #ffc9a9; --orb-op: .85;
    --display: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
    --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #090b16; --ink: #eef0fb; --muted: #9aa0bd; --accent: #a0adff;
      --glass: rgba(255,255,255,.06); --glass-line: rgba(255,255,255,.14);
      --tile: rgba(255,255,255,.1); --shadow: 0 12px 40px rgba(0,0,0,.45);
      --spot: rgba(255,255,255,.12);
      --o1: #3445ff; --o2: #7a3cff; --o3: #ff7a59; --orb-op: .5;
    }
  }
  :root[data-theme="dark"] {
    --bg: #090b16; --ink: #eef0fb; --muted: #9aa0bd; --accent: #a0adff;
    --glass: rgba(255,255,255,.06); --glass-line: rgba(255,255,255,.14);
    --tile: rgba(255,255,255,.1); --shadow: 0 12px 40px rgba(0,0,0,.45);
    --spot: rgba(255,255,255,.12);
    --o1: #3445ff; --o2: #7a3cff; --o3: #ff7a59; --orb-op: .5;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 1.0625rem/1.6 var(--body); -webkit-font-smoothing: antialiased;
    overflow-x: hidden; transition: background .4s ease, color .4s ease;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

  /* Background circles */
  .orbs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    transform: translate(calc(var(--px, 0) * 22px), calc(var(--py, 0) * 22px)); transition: transform .8s ease-out; }
  .orb { position: absolute; border-radius: 50%; filter: blur(34px); opacity: var(--orb-op);
    transition: background .4s ease, opacity .4s ease; animation: drift 22s ease-in-out infinite alternate; }
  .orb.a { width: min(62vmax, 44rem); aspect-ratio: 1; background: var(--o1); right: -14vmax; top: -10vmax; }
  .orb.b { width: min(38vmax, 28rem); aspect-ratio: 1; background: var(--o2); left: -10vmax; top: 52vh; animation-duration: 28s; animation-delay: -6s; }
  .orb.c { width: min(26vmax, 20rem); aspect-ratio: 1; background: var(--o3); right: 18vw; top: 70vh; animation-duration: 25s; animation-delay: -12s; }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-3vmax, 4vmax); } }

  .page { position: relative; z-index: 1; max-width: 76rem; margin: 0 auto;
    padding: 1.5rem clamp(1.25rem, 5vw, 4rem) 2rem; animation: in 1.1s ease both; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .glass {
    background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--shadow), inset 0 1px 0 var(--glass-line);
    -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%);
  }

  .top { display: flex; justify-content: flex-end; }
  #theme { width: 2.6rem; height: 2.6rem; display: grid; place-items: center; padding: 0; border-radius: 50%; cursor: pointer; transition: transform .4s ease; }
  #theme:hover { transform: rotate(20deg); }
  #theme svg { width: 1.2rem; height: 1.2rem; }

  /* Hero */
  .hero { position: relative; min-height: calc(100vh - 9rem); display: flex; flex-direction: column; justify-content: center; padding: 3rem 0; }
  .hero > .copy { position: relative; z-index: 1; }
  h1 { margin: 0; font-family: var(--display); font-weight: 500; font-size: clamp(3.6rem, 14vw, 10.5rem); line-height: .92; letter-spacing: -.045em; }
  h1 span { display: block; }
  .line { margin: 1.75rem 0 0; max-width: 26rem; color: var(--muted); font-size: 1.15rem; }
  .links { display: flex; gap: .75rem; margin-top: 1.75rem; }
  .pill { padding: .65rem 1.4rem; border-radius: 999px; text-decoration: none; font-weight: 500;
    transition: transform .2s ease, border-color .2s ease, color .2s ease; }
  .pill:hover { transform: translateY(-2px); color: var(--accent); border-color: var(--accent); }

  /* Cursor follower */
  .cursor { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; width: 2.6rem; height: 2.6rem; margin: -1.3rem 0 0 -1.3rem; opacity: 0; transition: opacity .3s ease; }
  .cursor.on { opacity: 1; }
  .cursor i { display: block; width: 100%; height: 100%; border-radius: 50%; border: 1.5px solid var(--accent);
    background: rgba(120,130,255,.1); background: color-mix(in srgb, var(--accent) 12%, transparent);
    transition: transform .25s ease, background .25s ease; }
  .cursor.big i { transform: scale(1.8); background: rgba(120,130,255,.18); background: color-mix(in srgb, var(--accent) 20%, transparent); }
  @media (pointer: coarse) { .cursor { display: none; } }

  /* Things I like */
  .likes { padding: 2rem 0 4rem; }
  .likes h2 { margin: 0; font: 500 clamp(2rem, 5vw, 3rem)/1.1 var(--display); letter-spacing: -.03em; }
  .likes .sub { margin: .5rem 0 2rem; color: var(--muted); }
  .grid { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); }
  .card { position: relative; border-radius: 26px; padding: 1.5rem; display: flex; flex-direction: column; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .3s ease;
    background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), var(--spot), transparent 65%); }
  .card:hover::before { opacity: 1; }
  .card > * { position: relative; }
  .card h3 { margin: 0; font: 500 1.6rem/1.2 var(--display); letter-spacing: -.02em; }
  .card .desc { margin: .25rem 0 0; color: var(--muted); }
  .widget { flex: 1; display: grid; place-items: center; padding: 1.5rem 0; min-height: 13rem; }
  .foot { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .95rem; min-height: 1.6rem; }
  .link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); font-weight: 500; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .link:hover { color: var(--accent); }

  /* Sliding puzzle */
  .board { position: relative; width: min(100%, 12.5rem); aspect-ratio: 1; }
  .tile { position: absolute; width: 33.3333%; height: 33.3333%; padding: 3px; border: 0; background: none; cursor: pointer; transition: left .18s ease, top .18s ease; }
  .tile span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 14px; background: var(--tile);
    border: 1px solid var(--glass-line); font: 500 1.4rem var(--display); transition: background .3s ease, color .3s ease; }
  .tile:hover span { border-color: var(--accent); }
  .board.won .tile span { background: var(--accent); color: var(--bg); border-color: transparent; }

  /* Piano */
  .keys { display: flex; gap: .4rem; width: 100%; }
  .key { flex: 1; height: 8rem; border-radius: 14px; background: var(--tile); border: 1px solid var(--glass-line); cursor: pointer;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: .6rem; font: 500 .85rem var(--display); color: var(--muted);
    transition: transform .12s ease, background .2s ease, color .2s ease; }
  .key:hover { border-color: var(--accent); }
  .key.on { transform: translateY(4px); background: var(--accent); color: var(--bg); }

  /* Rep ring */
  .ring { position: relative; width: 9.5rem; height: 9.5rem; padding: 0; background: none; border: 0; border-radius: 50%; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .ring svg { width: 100%; height: 100%; display: block; }
  .ring .track { fill: none; stroke: var(--glass-line); stroke-width: 6; }
  .ring .bar { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .3s ease; }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; font: 500 2.6rem var(--display); }
  .ring.pulse { animation: pulse .6s ease; }
  @keyframes pulse { 40% { transform: scale(1.07); } }

  footer { color: var(--muted); font-size: .875rem; padding-top: 1rem; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>

<div class="page">
  <header class="top">
    <button id="theme" class="glass" type="button" aria-label="Switch to dark theme"></button>
  </header>

  <main>
    <section class="hero">
      <div class="copy">
        <h1><span>Harsh</span><span>Sharma</span></h1>
        <p class="line">Puzzles, music, and staying active. I like things that take patience.</p>
        <nav class="links" aria-label="Contact">
          <a class="pill glass" href="mailto:harshusharma9896@gmail.com">Email</a>
          <a class="pill glass" href="https://github.com/ha7shu">GitHub</a>
        </nav>
      </div>
    </section>

    <section class="likes" aria-labelledby="likes-h">
      <h2 id="likes-h">Things I like</h2>
      <p class="sub">Go on, try them.</p>
      <div class="grid">
        <article class="card glass">
          <h3>Puzzles</h3>
          <p class="desc">Slide the tiles back in order.</p>
          <div class="widget"><div class="board" id="board"></div></div>
          <div class="foot"><span id="pStatus"></span><button class="link" id="shuffle" type="button">Shuffle</button></div>
        </article>

        <article class="card glass">
          <h3>Music</h3>
          <p class="desc">A few soft notes.</p>
          <div class="widget"><div class="keys" id="keys"></div></div>
          <div class="foot"><span>Tap a key. Sound on.</span></div>
        </article>

        <article class="card glass">
          <h3>Staying active</h3>
          <p class="desc">Ten reps makes a set.</p>
          <div class="widget">
            <button class="ring" id="rep" type="button" aria-label="Add a rep">
              <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="44"/><circle class="bar" id="bar" cx="50" cy="50" r="44" transform="rotate(-90 50 50)"/></svg>
              <span class="num" id="count">0</span>
            </button>
          </div>
          <div class="foot"><span id="repMeta">0 sets done</span></div>
        </article>
      </div>
    </section>
  </main>

  <footer>© <span id="year"></span> Harsh Sharma</footer>
</div>

<div class="cursor" id="cursor" aria-hidden="true"><i></i></div>


<script>
  var root = document.documentElement;
  var calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var fine = matchMedia("(pointer: fine)").matches;
  document.getElementById("year").textContent = new Date().getFullYear();

  /* ---------- Theme ---------- */
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  var tbtn = document.getElementById("theme");
  function isDark() {
    var t = root.getAttribute("data-theme");
    return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function paintTheme() {
    var d = isDark();
    tbtn.innerHTML = d ? SUN : MOON;
    tbtn.setAttribute("aria-label", d ? "Switch to light theme" : "Switch to dark theme");
  }
  tbtn.addEventListener("click", function () { root.setAttribute("data-theme", isDark() ? "light" : "dark"); paintTheme(); });
  paintTheme();

  /* ---------- Circles drift with the pointer; cards get a soft spotlight ---------- */
  if (!calm && fine) {
    var orbs = document.querySelector(".orbs");
    window.addEventListener("pointermove", function (e) {
      orbs.style.setProperty("--px", (e.clientX / innerWidth - 0.5) * 2);
      orbs.style.setProperty("--py", (e.clientY / innerHeight - 0.5) * 2);
    });
    document.querySelectorAll(".card").forEach(function (c) {
      c.addEventListener("pointermove", function (e) {
        var r = c.getBoundingClientRect();
        c.style.setProperty("--mx", (e.clientX - r.left) + "px");
        c.style.setProperty("--my", (e.clientY - r.top) + "px");
      });
    });
  }

  /* ---------- Cursor follower ---------- */
  if (!calm && fine) {
    var cur = document.getElementById("cursor"), cxp = 0, cyp = 0, tx = 0, ty = 0, started = false;
    function follow() {
      cxp += (tx - cxp) * 0.16; cyp += (ty - cyp) * 0.16;
      cur.style.transform = "translate3d(" + cxp + "px," + cyp + "px,0)";
      requestAnimationFrame(follow);
    }
    window.addEventListener("pointermove", function (e) {
      tx = e.clientX; ty = e.clientY;
      if (!started) { cxp = tx; cyp = ty; started = true; follow(); }
      cur.classList.add("on");
      cur.classList.toggle("big", !!(e.target.closest && e.target.closest("a, button")));
    });
    document.documentElement.addEventListener("mouseleave", function () { cur.classList.remove("on"); });
  }

  /* ---------- Puzzle: 3x3 sliding tiles ---------- */
  var board = document.getElementById("board"), pStatus = document.getElementById("pStatus");
  var cells = [], moves = 0, tiles = [];
  function nbrs(e) {
    var r = Math.floor(e / 3), c = e % 3, n = [];
    if (r > 0) n.push(e - 3); if (r < 2) n.push(e + 3); if (c > 0) n.push(e - 1); if (c < 2) n.push(e + 1);
    return n;
  }
  function isSolved() { for (var i = 0; i < 8; i++) if (cells[i] !== i + 1) return false; return true; }
  function paintPuzzle() {
    tiles.forEach(function (t, i) {
      var p = cells.indexOf(i + 1);
      t.style.left = (p % 3) * 33.3333 + "%";
      t.style.top = Math.floor(p / 3) * 33.3333 + "%";
    });
    var won = isSolved();
    board.classList.toggle("won", won);
    pStatus.textContent = won ? "Solved in " + moves + " moves" : moves + (moves === 1 ? " move" : " moves");
  }
  function shuffle() {
    do {
      cells = [1, 2, 3, 4, 5, 6, 7, 8, 0];
      var prev = -1;
      for (var k = 0; k < 80; k++) {
        var e = cells.indexOf(0);
        var opts = nbrs(e).filter(function (p) { return p !== prev; });
        var p = opts[Math.floor(Math.random() * opts.length)];
        cells[e] = cells[p]; cells[p] = 0; prev = e;
      }
    } while (isSolved());
    moves = 0; paintPuzzle();
  }
  for (var v = 1; v <= 8; v++) (function (v) {
    var t = document.createElement("button");
    t.type = "button"; t.className = "tile"; t.setAttribute("aria-label", "Tile " + v);
    t.innerHTML = "<span>" + v + "</span>";
    t.addEventListener("click", function () {
      var p = cells.indexOf(v), e = cells.indexOf(0);
      if (nbrs(e).indexOf(p) < 0) return;
      cells[e] = v; cells[p] = 0; moves++; paintPuzzle();
    });
    board.appendChild(t); tiles.push(t);
  })(v);
  document.getElementById("shuffle").addEventListener("click", shuffle);
  shuffle();

  /* ---------- Music: five soft keys ---------- */
  var NOTES = [["C", 261.63], ["D", 293.66], ["E", 329.63], ["G", 392.0], ["A", 440.0], ["C", 523.25]];
  var ac;
  function play(f) {
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = ac || new AC(); if (ac.state === "suspended") ac.resume();
    var t = ac.currentTime, o1 = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), g2 = ac.createGain();
    o1.type = "sine"; o1.frequency.value = f; o2.type = "triangle"; o2.frequency.value = f * 2; g2.gain.value = .12;
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.18, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + 1.4);
    o1.start(t); o2.start(t); o1.stop(t + 1.5); o2.stop(t + 1.5);
  }
  var keys = document.getElementById("keys");
  NOTES.forEach(function (n) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "key"; b.textContent = n[0]; b.setAttribute("aria-label", "Play note " + n[0]);
    b.addEventListener("click", function () {
      play(n[1]); b.classList.add("on");
      setTimeout(function () { b.classList.remove("on"); }, 160);
    });
    keys.appendChild(b);
  });

  /* ---------- Reps: tap to fill the ring ---------- */
  var rep = document.getElementById("rep"), bar = document.getElementById("bar"), count = document.getElementById("count"), meta = document.getElementById("repMeta");
  var C = 2 * Math.PI * 44, n = 0, sets = 0, busy = false;
  bar.style.strokeDasharray = C; bar.style.strokeDashoffset = C;
  function paintRep() {
    bar.style.strokeDashoffset = C * (1 - n / 10);
    count.textContent = n;
    meta.textContent = sets + (sets === 1 ? " set done" : " sets done");
  }
  rep.addEventListener("click", function () {
    if (busy) return;
    n++; paintRep();
    if (n === 10) {
      busy = true; sets++; rep.classList.add("pulse");
      setTimeout(function () { rep.classList.remove("pulse"); n = 0; paintRep(); busy = false; }, 800);
    }
  });
  paintRep();
</script>
</body>
</html>
